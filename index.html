<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Milano Star H2</title>
  <meta name="theme-color" content="#5b3a29">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Milano Star">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta http-equiv="Cache-Control" content="no-cache">
  <link rel="stylesheet" href="styles.css?v=202611120739">
  <script src="config.js?v=202611120739"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js?v=202611120739" defer></script>
</head>
<body>
  <button id="updateBar" class="update-bar" type="button" hidden></button>
  <header class="topbar">
    <div class="brand">Milano Star H2</div>
    <div class="who-top" id="whoTop"></div>
    <div class="conn" id="conn" aria-live="polite"></div>
    <button id="bigBtn" class="lang big-btn" type="button" aria-pressed="false">A+</button>
    <button id="langBtn" class="lang" type="button"></button>
  </header>

  <main>
    <section id="screen-loading" class="screen">
      <p class="muted" data-i18n="loading"></p>
      <button id="retryBootBtn" class="btn" type="button" hidden data-i18n="retry"></button>
    </section>

    <section id="screen-config" class="screen" hidden>
      <h1 data-i18n="configTitle"></h1>
      <p data-i18n="configText"></p>
    </section>

    <section id="screen-login" class="screen" hidden>
      <h1 data-i18n="signInTitle"></h1>
      <p class="muted" data-i18n="signInText"></p>
      <div id="inAppNote" class="note" hidden>
        <p data-i18n="inAppText"></p>
        <a id="openBrowserBtn" class="btn btn-primary link-btn" hidden data-i18n="openInChrome"></a>
        <button id="copyLinkBtn" class="btn link-btn" type="button" data-i18n="copyLink"></button>
      </div>
      <div id="gsiButton" class="gsi"></div>
      <p id="loginError" class="error" hidden></p>
    </section>

    <section id="screen-pending" class="screen" hidden>
      <div class="badge">⏳</div>
      <h1 data-i18n="pendingTitle"></h1>
      <p data-i18n="pendingText"></p>
      <p class="who" id="pendingWho"></p>
      <button id="checkAgainBtn" class="btn btn-primary" type="button" data-i18n="checkAgain"></button>
      <button class="btn btn-ghost js-logout" type="button" data-i18n="logout"></button>
    </section>

    <section id="screen-blocked" class="screen" hidden>
      <div class="badge">⛔</div>
      <h1 data-i18n="blockedTitle"></h1>
      <p data-i18n="blockedText"></p>
      <button class="btn btn-ghost js-logout" type="button" data-i18n="logout"></button>
    </section>

    <!-- Основное приложение (после одобрения) -->
    <section id="screen-app" class="screen app" hidden>
      <button id="backBar" class="back-bar" type="button" hidden data-i18n="back"></button>

      <div id="view-sell" class="view">
        <div id="shiftGate" class="card gate" hidden></div>
        <div id="catBar" class="cat-bar" role="tablist"></div>
        <div id="productGrid" class="grid"></div>
        <p id="noProducts" class="muted" hidden data-i18n="noProducts"></p>
      </div>

      <div id="view-receipts" class="view" hidden>
        <div class="row-head">
          <h1 data-i18n="receiptsTitle"></h1>
          <button id="reloadSalesBtn" class="btn btn-small" type="button" data-i18n="refresh"></button>
        </div>
        <div class="seg" role="tablist">
          <button id="dayToday" class="seg-btn active" type="button" data-i18n="today"></button>
          <button id="dayYesterday" class="seg-btn" type="button" data-i18n="yesterday"></button>
        </div>
        <p id="salesScope" class="muted small"></p>
        <div id="openOrders" class="list" hidden></div>
        <div id="salesTotals" class="stats"></div>
        <div id="salesList" class="list"></div>
      </div>

      <div id="view-more" class="view" hidden>
        <h1 id="homeHello"></h1>
        <p class="role-chip" id="homeRole"></p>
        <div id="shiftCard" class="card"></div>
        <button id="cashDayBtn" class="btn btn-primary" type="button" hidden data-i18n="cashDayTitle"></button>
        <button id="helpBtn" class="btn btn-primary" type="button" data-i18n="helpTitle"></button>
        <button id="productsBtn" class="btn" type="button" hidden data-i18n="productsTitle"></button>
        <button id="usersBtn" class="btn" type="button" hidden data-i18n="usersTitle"></button>
        <button id="pingBtn" class="btn" type="button" data-i18n="testAccess"></button>
        <p id="pingResult" class="result" hidden></p>
        <button id="logoutAllBtn" class="btn btn-ghost" type="button" data-i18n="logoutAll"></button>
        <button class="btn btn-ghost js-logout" type="button" data-i18n="logout"></button>
        <button id="appUpdateBtn" class="btn btn-ghost" type="button" data-i18n="appUpdate"></button>
        <p class="muted small" id="appVersionLine"></p>
        <p class="muted small" id="versionLine"></p>
      </div>

      <div id="view-users" class="view" hidden>
        <button class="btn btn-ghost btn-small js-back-more" type="button" data-i18n="back"></button>
        <div class="row-head">
          <h1 data-i18n="usersTitle"></h1>
          <button id="reloadUsersBtn" class="btn btn-small" type="button" data-i18n="refresh"></button>
        </div>
        <div id="usersList" class="list"></div>
      </div>

      <div id="view-cashday" class="view" hidden>
        <button class="btn btn-ghost btn-small js-back-more" type="button" data-i18n="back"></button>
        <div class="row-head">
          <h1 data-i18n="cashDayTitle"></h1>
          <button id="reloadCashDayBtn" class="btn btn-small" type="button" data-i18n="refresh"></button>
        </div>
        <div id="cashDayDates" class="cat-bar"></div>
        <div id="cashDayBody" class="list"></div>
      </div>

      <div id="view-help" class="view" hidden>
        <button class="btn btn-ghost btn-small js-back-more" type="button" data-i18n="back"></button>
        <h1 data-i18n="helpTitle"></h1>
        <div id="helpBody" class="list"></div>
      </div>

      <div id="view-owner" class="view viz-root" hidden>
        <div class="seg" role="tablist">
          <button id="segDash" class="seg-btn active" type="button" data-i18n="dashboard"></button>
          <button id="segExp" class="seg-btn" type="button" data-i18n="expensesTitle"></button>
          <button id="segStock" class="seg-btn" type="button" data-i18n="stockTitle"></button>
          <button id="segBak" class="seg-btn" type="button" data-i18n="backupsTitle"></button>
        </div>
        <div id="periodBar" class="cat-bar" role="tablist"></div>
        <p id="periodLine" class="muted small"></p>
        <div id="dashBody" class="view"></div>
        <div id="expBody" class="view" hidden></div>
        <div id="stockBody" class="view" hidden></div>
        <div id="bakBody" class="view" hidden></div>
      </div>

      <div id="view-products" class="view" hidden>
        <button class="btn btn-ghost btn-small js-back-more" type="button" data-i18n="back"></button>
        <div class="row-head">
          <h1 data-i18n="productsTitle"></h1>
          <button id="addProductBtn" class="btn btn-small btn-primary" type="button" data-i18n="addProduct"></button>
        </div>
        <p class="muted small" data-i18n="productsHint"></p>
        <div id="productsAdminList" class="list"></div>
      </div>
    </section>
  </main>

  <!-- Корзина (видна на экране продажи) -->
  <div id="cartPanel" class="cart" hidden>
    <div id="cartLines" class="cart-lines" hidden></div>
    <div class="cart-bar">
      <button id="cartToggle" class="cart-summary" type="button">
        <span id="cartCount"></span>
        <strong id="cartTotal"></strong>
      </button>
      <button id="cartClear" class="btn btn-small btn-ghost" type="button" data-i18n="clear"></button>
    </div>
    <div id="cartActions" class="cart-actions">
      <button id="payCashBtn" class="btn btn-primary" type="button" data-i18n="payCash"></button>
      <button id="payQrBtn" class="btn btn-primary" type="button" data-i18n="payQr"></button>
      <button id="laterBtn" class="btn btn-second" type="button" data-i18n="laterBtn"></button>
      <button id="freeBtn" class="btn btn-second" type="button" data-i18n="freeBtn"></button>
    </div>
  </div>

  <nav id="tabbar" class="tabbar" hidden>
    <button class="tab active" type="button" data-view="sell"><span>🛒</span><span data-i18n="tabSell"></span></button>
    <button class="tab" type="button" data-view="receipts"><span>🧾</span><span data-i18n="tabReceipts"></span></button>
    <button id="ownerTab" class="tab" type="button" data-view="owner" hidden><span>📊</span><span data-i18n="tabOwner"></span></button>
    <button class="tab" type="button" data-view="more"><span>☰</span><span data-i18n="tabMore"></span></button>
  </nav>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
